<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="auto">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060b"/>
      <stop offset="60%" stop-color="#0b0914"/>
      <stop offset="100%" stop-color="#140e1f"/>
    </linearGradient>

    <!-- Warm golden-amber accretion glow -->
    <radialGradient id="accretionGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07060b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="50%" stop-color="rgba(251, 191, 36, 0.35)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Container Box with Rounded Corners and Glass Border -->
  <rect x="1" y="1" width="878" height="238" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Accretion Glow Layer -->
  <rect x="1" y="1" width="878" height="238" rx="14" fill="url(#accretionGlow)"/>

  <!-- Star Points in Deep Space -->
  <circle cx="80" cy="45" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="160" cy="190" r="1.2" fill="#fef3c7" opacity="0.6"/>
  <circle cx="280" cy="50" r="1" fill="#dbeafe" opacity="0.8"/>
  <circle cx="420" cy="195" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="560" cy="35" r="1" fill="#fef3c7" opacity="0.5"/>
  <circle cx="680" cy="205" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="810" cy="65" r="1.2" fill="#dbeafe" opacity="0.8"/>

  <!-- Orbital Rings Geometry (Right Side) -->
  <g transform="translate(710, 110) rotate(-15.5)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 12"/>
    <ellipse cx="0" cy="0" rx="100" ry="38" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 8"/>
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="1 6"/>
    <circle cx="75" cy="16" r="3" fill="#fbbf24"/>
    <circle cx="-45" cy="-14" r="2.5" fill="#fef3c7"/>
  </g>

  <!-- Left Content -->
  <!-- Kicker Tagline -->
  <text x="48" y="58" class="mono" font-size="11" fill="#d97706" letter-spacing="3.5" text-transform="uppercase" font-weight="600">
    SYSTEMS ARCHITECT &amp; PRODUCT BUILDER
  </text>

  <!-- Main Name -->
  <text x="46" y="112" class="display" font-size="44" fill="#ffffff" letter-spacing="1.5">
    NEO TAN
  </text>

  <!-- Description / Subheading -->
  <text x="48" y="148" class="body" font-size="14.5" fill="#cbd5e1" font-weight="400">
    AWS Solutions Architect (Professional) · Full-Stack Engineer · Canada 🇨🇦
  </text>

  <!-- Skill Badges Bar -->
  <g transform="translate(48, 178)">
    <!-- Pill 1: AWS SAP -->
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e1828" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1"/>
    <text x="14" y="17" class="mono" font-size="11" fill="#fbbf24" font-weight="500">☁️ AWS SAP Cert</text>

    <!-- Pill 2: Full-Stack React & TS -->
    <rect x="148" y="0" width="148" height="26" rx="6" fill="#1a1c27" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1"/>
    <text x="160" y="17" class="mono" font-size="11" fill="#93c5fd" font-weight="500">⚛️ React &amp; TypeScript</text>

    <!-- Pill 3: Cloudflare & Edge -->
    <rect x="306" y="0" width="156" height="26" rx="6" fill="#1f1816" stroke="rgba(251, 146, 60, 0.3)" stroke-width="1"/>
    <text x="318" y="17" class="mono" font-size="11" fill="#fdba74" font-weight="500">⚡ Cloudflare Workers</text>

    <!-- Pill 4: AI Systems -->
    <rect x="472" y="0" width="130" height="26" rx="6" fill="#161e20" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
    <text x="484" y="17" class="mono" font-size="11" fill="#5eead4" font-weight="500">🤖 AI Humanizer</text>
  </g>
</svg>
